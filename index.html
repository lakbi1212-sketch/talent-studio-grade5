<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b1f6e">
<title>Talent Studio · Grade 5 Unit 1</title>
<style>
:root{--ink:#241540;--bg:#fff7e8;--card:#fff;--p:#5b2fa8;--p2:#3b1f6e;--gold:#f6b81a;--ok:#1f9d63;--bad:#d9433a;--soft:#efe6ff;--line:#e5d9f7}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45}
header{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 10px;font-size:18px}
main{max-width:760px;margin:0 auto;padding:16px 14px 60px}
.ar{direction:rtl;text-align:right;font-size:16px;color:#5a4a7a;margin:2px 0 10px}
h2{margin:6px 0 2px;font-size:24px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.btn{display:inline-block;background:var(--p);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:18px;font-weight:700;cursor:pointer;min-height:48px}
.btn.alt{background:var(--soft);color:var(--p2)}
.btn.gold{background:var(--gold);color:#3a2600}
.btn:disabled{opacity:.45}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.stn{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;font-size:17px;cursor:pointer;color:var(--ink);min-height:112px}
.stn b{font-size:18px}.stn .st{color:var(--gold);letter-spacing:2px;font-size:20px;margin-top:auto}
.stn.done{border-color:var(--ok)}
.stn .em{font-size:30px}
.stn small{color:#5a4a7a;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--soft);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--p2);font-size:16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;font-size:18px;color:var(--ink);cursor:pointer;min-height:48px}
.opt.right{background:#dff5e9;border-color:var(--ok)}
.opt.wrong{background:#fde3e1;border-color:var(--bad)}
.opt:disabled{cursor:default}
.hint{background:#fff3cf;border-radius:12px;padding:10px;margin:8px 0;font-size:16px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:16px}
.bar span.n{width:70px;font-weight:700}
.bar span.b{flex:1;height:14px;border-radius:7px;background:#eadff9;position:relative;overflow:hidden}
.bar span.b i{position:absolute;left:0;top:0;bottom:0;background:var(--p);border-radius:7px}
.prog{height:10px;background:#eadff9;border-radius:6px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--gold)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.back{background:none;border:0;color:var(--p);font-size:17px;font-weight:700;padding:8px 0;cursor:pointer}
.fc{text-align:center;padding:20px 10px}
.fc .w{font-size:40px;font-weight:800;color:var(--p2)}
.fc .m{font-size:26px;margin-top:6px}
.pf{display:flex;gap:12px;align-items:center}
.pf svg{flex:0 0 auto}
select,input[type=text],textarea{width:100%;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:180px}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;gap:10px;align-items:flex-start;margin:6px 0;font-size:17px}
.ck input{width:24px;height:24px;margin-top:2px;flex:0 0 auto}
.big{font-size:54px;text-align:center}
.center{text-align:center}
.pc{border:2px solid var(--line);border-radius:14px;padding:6px 8px;background:#fff;text-align:center;cursor:pointer;font-size:15px;color:var(--ink)}
.pc.sel{border-color:var(--p);background:var(--soft)}
.perfs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:360px){.grid{grid-template-columns:1fr}.perfs{grid-template-columns:repeat(2,1fr)}}
.sm{font-size:14px;color:#5a4a7a}
</style>
</head>
<body>
<header><h1>🎭 Talent Studio</h1><button id="snd" aria-label="Sound on or off">🔊</button></header>
<main id="app"></main>
<script>
(function(){
'use strict';
var KEY='talentstudio-g5u1-v1';
var S=load();
function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');o.stars=o.stars||{};o.known=o.known||{};if(o.sound===undefined)o.sound=true;o.write=o.write||{};o.mix=o.mix||{};return o}catch(e){return{stars:{},known:{},sound:true,write:{},mix:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var app=document.getElementById('app');
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
// ---- sound
var ac;function beep(f,d,t){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function good(){beep(660,.12);setTimeout(function(){beep(880,.18)},110)}
function bad(){beep(200,.25,'triangle')}
function say(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
var snd=document.getElementById('snd');function sndUi(){snd.textContent=S.sound?'🔊':'🔇'}
snd.onclick=function(){S.sound=!S.sound;save();sndUi()};sndUi();
// ---- data
var WORDS=[
['shy','خجول','confident','Shy people feel nervous with new people.'],
['confident','واثق من نفسه','shy','A confident person believes in themselves.'],
['lazy','كسول','hard-working','A lazy person does not want to work.'],
['hard-working','مجتهد','lazy','A hard-working person works a lot.'],
['friendly','ودود','unfriendly','A friendly person is nice to everyone.'],
['unfriendly','غير ودود','friendly','An unfriendly person does not say hello.'],
['kind','لطيف / طيب','mean','A kind person helps others.'],
['mean','قاسٍ / غير لطيف','kind','A mean person is not nice to others.'],
['polite','مؤدب','rude','A polite person says please and thank you.'],
['rude','غير مؤدب','polite','A rude person is not polite.'],
['tidy','مرتب','untidy','A tidy room is clean and in order.'],
['untidy','غير مرتب','tidy','An untidy room has things everywhere.']
];
var AV={m:['#7a4a2b','#3b2314'],f:['#e0ac84','#2a1a10']};
var PERF=[
{id:'hamad',n:'Hamad',g:'m',skill:'juggling',doing:'juggle',traits:['confident','friendly'],hair:['short','dark','straight'],sc:{tidy:3,hw:3,fr:5,conf:5,skill:9}, c:'#e8573c'},
{id:'salma',n:'Salma',g:'f',skill:'baking cakes',doing:'bake cakes',traits:['hard-working','kind'],hair:['long','dark','curly'],sc:{tidy:4,hw:5,fr:4,conf:3,skill:10},c:'#2a9d8f'},
{id:'yousuf',n:'Yousuf',g:'m',skill:'fixing toys',doing:'fix toys',traits:['shy','polite'],hair:['short','dark','curly'],sc:{tidy:5,hw:4,fr:3,conf:1,skill:8},c:'#3d6fd0'},
{id:'maryam',n:'Maryam',g:'f',skill:'doing experiments',doing:'do experiments',traits:['confident','untidy'],hair:['long','fair','straight'],sc:{tidy:1,hw:4,fr:3,conf:4,skill:7},c:'#9b51e0'},
{id:'khalid',n:'Khalid',g:'m',skill:'throwing a ball',doing:'throw a ball',traits:['lazy','friendly'],hair:['short','fair','wavy'],sc:{tidy:2,hw:1,fr:4,conf:3,skill:5},c:'#e29a17'},
{id:'noor',n:'Noor',g:'f',skill:'making pizza',doing:'make pizza',traits:['tidy','polite'],hair:['short','dark','wavy'],sc:{tidy:4,hw:3,fr:4,conf:2,skill:6},c:'#d6457f'}
];
function P(id){return PERF.filter(function(p){return p.id===id})[0]}
function he(p){return p.g==='m'?'He':'She'}
function his(p){return p.g==='m'?'his':'her'}
function avatar(p,sz){sz=sz||84;var a=AV[p.g],hair=p.hair[1]==='fair'?'#c9a24a':'#2a1a10',hl=p.hair[0]==='long';
return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 100 100" role="img" aria-label="'+esc(p.n)+'">'+
'<circle cx="50" cy="50" r="50" fill="'+p.c+'" opacity=".18"/>'+
(hl?'<rect x="22" y="30" width="56" height="52" rx="22" fill="'+hair+'"/>':'')+
'<rect x="30" y="62" width="40" height="34" rx="14" fill="'+p.c+'"/>'+
'<circle cx="50" cy="44" r="21" fill="'+a[0].replace('#7a4a2b','#c58a5a')+'"/>'+
'<path d="M29 42 Q50 12 71 42 Q60 30 50 30 Q40 30 29 42Z" fill="'+hair+'"/>'+
'<circle cx="43" cy="46" r="2.6" fill="#241540"/><circle cx="57" cy="46" r="2.6" fill="#241540"/>'+
'<path d="M43 54 Q50 60 57 54" stroke="#241540" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>'}
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function rate(id,n){if((S.stars[id]||0)<n){S.stars[id]=n;save()}}
// ---- shell
function show(node){app.innerHTML='';app.appendChild(node);window.scrollTo(0,0)}
function backBtn(){var b=el('<button class="back">← Studio</button>');b.onclick=home;return b}
var STN=[
['words','📖','Meet the words','تعرّف على الكلمات','12 words'],
['match','🧩','Find the word','اختر الكلمة المناسبة','12 sentences'],
['describe','🔍','Describe the performer','صف الموهوب','6 performers'],
['compare','⚖️','Compare','قارن بين الموهوبين','8 questions'],
['judge','🏆','The judges','لجنة التحكيم','Who is the best?'],
['write','✍️','Write your description','اكتب وصفك','Your own performer']
];
function home(){
var d=el('<div></div>');var tot=0;STN.forEach(function(s){tot+=S.stars[s[0]]||0});
d.innerHTML='<h2>Welcome to Talent Studio!</h2><div class="ar">مرحبًا بك في استوديو المواهب! ساعد المواهب الستة، ثم اكتب وصفك.</div>'+
'<div class="card"><div class="pf">'+avatar(PERF[1],70)+avatar(PERF[0],70)+avatar(PERF[3],70)+'</div><p>Six performers want to join the school talent show. Learn the words, describe them, compare them, and then write about your own performer.</p><div class="prog"><i style="width:'+Math.round(tot/18*100)+'%"></i></div><div class="sm">'+tot+' of 18 stars</div></div><div class="grid" id="g"></div>';
var g=d.querySelector('#g');
STN.forEach(function(s,i){var n=S.stars[s[0]]||0;var b=el('<button class="stn'+(n?' done':'')+'"><span class="em">'+s[1]+'</span><b>'+(i+1)+'. '+s[2]+'</b><small>'+s[4]+'</small><span class="st">'+stars(n)+'</span></button>');b.onclick=function(){go(s[0])};g.appendChild(b)});
if(tot>=12){var c=el('<div class="card center"><div class="big">🎬</div><b>Show time!</b><p>You have '+tot+' stars. Well done!</p></div>');d.appendChild(c)}
d.appendChild(el('<p class="sm center">Your stars are saved on this device only. Nothing is sent anywhere.</p>'));
show(d)}
function go(k){({words:words,match:match,describe:describe,compare:compare,judge:judge,write:write})[k]()}
// ---- generic quiz runner: items [{q,html,opts:[..],a:index,hint,say}]
function quiz(id,title,ar,items,onEnd){
var i=0,firstTry=0;
function render(){
var it=items[i];var d=el('<div></div>');d.appendChild(backBtn());
d.appendChild(el('<h2>'+title+'</h2>'));d.appendChild(el('<div class="ar">'+ar+'</div>'));
d.appendChild(el('<div class="prog"><i style="width:'+Math.round(i/items.length*100)+'%"></i></div>'));
var c=el('<div class="card"><div class="sm">Question '+(i+1)+' of '+items.length+'</div>'+it.html+'</div>');
if(it.say){var sb=el('<button class="btn alt" style="margin:6px 0">🔊 Listen</button>');sb.onclick=function(){say(it.say)};c.appendChild(sb)}
var tried=false,done=false,hintBox=el('<div></div>');
var opts=shuffle(it.opts.map(function(o,idx){return{o:o,ok:idx===it.a}}));
opts.forEach(function(op){var b=el('<button class="opt">'+esc(op.o)+'</button>');b.onclick=function(){
if(done)return;
if(op.ok){done=true;b.classList.add('right');good();if(!tried)firstTry++;
Array.prototype.forEach.call(c.querySelectorAll('.opt'),function(x){x.disabled=true});
hintBox.innerHTML='<div class="hint">✅ '+(it.ok||'Correct!')+'</div>';
var nx=el('<button class="btn gold" style="margin-top:8px">'+(i+1<items.length?'Next →':'Finish ✓')+'</button>');
nx.onclick=function(){i++;if(i<items.length)render();else end()};hintBox.appendChild(nx)}
else{tried=true;b.classList.add('wrong');b.disabled=true;bad();hintBox.innerHTML='<div class="hint">Try again. 💡 '+esc(it.hint||'Read the question again.')+'</div>'}};c.appendChild(b)});
c.appendChild(hintBox);d.appendChild(c);show(d)}
function end(){var pct=firstTry/items.length,n=pct>=.85?3:pct>=.6?2:1;rate(id,n);
var d=el('<div class="card center"><div class="big">'+(n===3?'🌟':'👏')+'</div><h2>'+firstTry+' / '+items.length+' on the first try</h2><div style="font-size:30px;color:#f6b81a">'+stars(n)+'</div><p>'+(n===3?'Fantastic!':'Good work! Try again for more stars.')+'</p></div>');
var b=el('<button class="btn">Back to the studio</button>');b.onclick=function(){onEnd?onEnd():home()};d.appendChild(b);
var r=el('<button class="btn alt" style="margin:8px">Play again</button>');r.onclick=function(){go(id)};d.appendChild(r);
var w=el('<div></div>');w.appendChild(d);show(w)}
render()}
// ---- 1 words
function words(){
var i=0;
function render(){
var w=WORDS[i];var d=el('<div></div>');d.appendChild(backBtn());
d.appendChild(el('<h2>Meet the words</h2>'));d.appendChild(el('<div class="ar">اضغط على 🔊 واستمع، ثم كرّر الكلمة.</div>'));
var known=Object.keys(S.known).length;
d.appendChild(el('<div class="prog"><i style="width:'+Math.round(known/12*100)+'%"></i></div>'));
var c=el('<div class="card fc"><div class="sm">Word '+(i+1)+' of 12</div><div class="w">'+w[0]+'</div><div class="m ar" style="text-align:center" lang="ar" dir="rtl">'+w[1]+'</div><p>'+esc(w[3])+'</p><div class="chips" style="justify-content:center"><span class="chip">Opposite: '+w[2]+'</span></div></div>');
var l=el('<button class="btn">🔊 Listen</button>');l.onclick=function(){say(w[0])};
var l2=el('<button class="btn alt" style="margin-left:6px">🔊 Sentence</button>');l2.onclick=function(){say(w[3])};
var k=el('<label class="ck" style="justify-content:center"><input type="checkbox"'+(S.known[w[0]]?' checked':'')+'> I know this word</label>');
k.querySelector('input').onchange=function(e){if(e.target.checked){S.known[w[0]]=1;good()}else delete S.known[w[0]];save();var n=Object.keys(S.known).length;if(n>=12)rate('words',3);else if(n>=8)rate('words',2);else if(n>=4)rate('words',1)};
c.appendChild(l);c.appendChild(l2);c.appendChild(k);d.appendChild(c);
var nav=el('<div class="row2"></div>');
var pb=el('<button class="btn alt">← Back</button>');pb.disabled=i===0;pb.onclick=function(){i--;render()};
var nb=el('<button class="btn">'+(i<11?'Next →':'Done ✓')+'</button>');nb.onclick=function(){if(i<11){i++;render()}else home()};
nav.appendChild(pb);nav.appendChild(nb);d.appendChild(nav);
d.appendChild(el('<p class="sm center">Tick 4 words for ★, 8 for ★★, all 12 for ★★★.</p>'));show(d)}
render()}
// ---- 2 match
var MATCH=[
['Hamad is not afraid to talk in front of everyone. He is very ___.','confident',['confident','lazy','untidy'],'Not afraid = believes in himself.'],
['Yousuf never talks first in a new group. He is ___.','shy',['shy','rude','friendly'],'He feels nervous with new people.'],
['Salma practises baking every day after school. She is ___.','hard-working',['hard-working','lazy','mean'],'She works a lot.'],
['Khalid sits on the sofa all day and does not help. He is ___.','lazy',['lazy','kind','tidy'],'He does not want to work.'],
['Noor always says "please" and "thank you". She is ___.','polite',['polite','rude','shy'],'Please and thank you are polite words.'],
['Ali pushed past his teacher and did not say sorry. That was ___.','rude',['rude','polite','tidy'],'Not polite = rude.'],
['Maryam\'s desk has books and papers everywhere. It is ___.','untidy',['untidy','tidy','kind'],'Things are everywhere.'],
['Yousuf puts every toy in its box. His room is ___.','tidy',['tidy','untidy','lazy'],'Everything is in order.'],
['Sara helped the new girl find her class. She is ___.','kind',['kind','mean','rude'],'She helps others.'],
['The boy laughed at Sami when he fell. He was ___.','mean',['mean','kind','polite'],'Not nice to others.'],
['Hamad says hello to everybody at school. He is ___.','friendly',['friendly','unfriendly','lazy'],'He is nice to everyone.'],
['The new student never says hello or smiles. She seems ___.','unfriendly',['unfriendly','friendly','confident'],'She is not friendly.']
];
function match(){quiz('match','Find the word','اختر الكلمة التي تكمل الجملة.',shuffle(MATCH).map(function(m){return{html:'<p style="font-size:20px">'+esc(m[0]).replace('___','<b>_____</b>')+'</p>',opts:m[2],a:m[2].indexOf(m[1]),hint:m[3],say:m[0].replace('___','blank')}}))}
// ---- 3 describe
function describe(){
var ps=shuffle(PERF),items=[];
ps.forEach(function(p){
var other=(p.traits[0]===WORDS[0][0])?'lazy':'shy';
var ANT={shy:'confident',confident:'shy',lazy:'hard-working','hard-working':'lazy',friendly:'unfriendly',unfriendly:'friendly',kind:'mean',mean:'kind',polite:'rude',rude:'polite',tidy:'untidy',untidy:'tidy'};var wrongT=[ANT[p.traits[0]],ANT[p.traits[1]]];
var tr=p.traits[Math.floor(Math.random()*2)];
items.push({html:'<div class="pf">'+avatar(p)+'<div><b>'+p.n+'</b><div class="chips"><span class="chip">'+p.traits[0]+'</span><span class="chip">'+p.traits[1]+'</span></div></div></div><p>What is '+p.n+' like? <br><span class="sm">Choose the true sentence.</span></p>',
opts:[he(p)+' seems '+tr+'.',he(p)+' seems '+wrongT[0]+'.',he(p)+' seems '+wrongT[1]+'.'],a:0,hint:'Look at the two words under the picture.',say:he(p)+' seems '+tr+'.'});
});
ps.slice(0,4).forEach(function(p){
var h=p.hair,right=he(p)+'\u2019s got '+h[0]+', '+h[1]+', '+h[2]+' hair.',w1=he(p)+'\u2019s got '+h[1]+', '+h[0]+', '+h[2]+' hair.',w2=he(p)+'\u2019s got '+h[2]+', '+h[1]+', '+h[0]+' hair.';
items.push({html:'<div class="pf">'+avatar(p)+'<div><b>'+p.n+'</b><div class="sm">'+h.join(', ')+' hair</div></div></div><p>Which sentence has the words in the right order?</p>',opts:[right,w1,w2],a:0,hint:'Say long or short first. Then the colour, then curly/straight.',say:right});
});
ps.slice(0,2).forEach(function(p){
var allg=PERF.filter(function(x){return x.id!==p.id});var wr=shuffle(allg).slice(0,2);
items.push({html:'<div class="pf">'+avatar(p)+'<div><b>'+p.n+'</b></div></div><p>What is '+p.n+' good at?</p>',opts:[he(p)+'\u2019s good at '+p.skill+'.',he(p)+'\u2019s good at '+wr[0].skill+'.',he(p)+'\u2019s good at '+wr[1].skill+'.'],a:0,hint:'Look at the studio list again: '+p.n+' can '+p.doing+'.',say:he(p)+' is good at '+p.skill+'.'});
});
quiz('describe','Describe the performer','انظر إلى الموهوب ثم اختر الجملة الصحيحة.',items)}
// ---- 4 compare
var ADJ=[
{k:'tidy',adj:'tidy',c:'tidier',s:'the tidiest',w:['tidyer','tidiest'],ws:['the tidyest','tidier'],rule:'Short words ending in -y: change y to i, add -er / -est.'},
{k:'fr',adj:'friendly',c:'friendlier',s:'the friendliest',w:['friendlyer','friendliest'],ws:['the friendlyest','friendlier'],rule:'friendly ends in -y: friendlier, the friendliest.'},
{k:'hw',adj:'hard-working',c:'more hard-working',s:'the most hard-working',w:['hard-workinger','most hard-working'],ws:['the hard-workingest','more hard-working'],rule:'Long words: use more / the most.'},
{k:'conf',adj:'confident',c:'more confident',s:'the most confident',w:['confidenter','most confident'],ws:['the confidentest','more confident'],rule:'Long words: use more / the most.'},
{k:'skill',adj:'good',c:'better',s:'the best',w:['gooder','best'],ws:['the goodest','better'],rule:'Irregular: good, better, the best.'}
];
var LBL={tidy:'Tidy',fr:'Friendly',hw:'Hard-working',conf:'Confident',skill:'Talent'};
function bars(key,ids){return '<div>'+ids.map(function(id){var p=P(id);var v=p.sc[key];var m=key==='skill'?10:5;return '<div class="bar"><span class="n">'+p.n+'</span><span class="b"><i style="width:'+Math.round(v/m*100)+'%"></i></span></div>'}).join('')+'</div>'}
function compare(){
var items=[];
shuffle(ADJ).concat(shuffle(ADJ).slice(0,3)).forEach(function(A,idx){
if(idx<5){
var ids=shuffle(PERF).map(function(p){return p});var a,b;
for(var t=0;t<30;t++){var x=shuffle(PERF);a=x[0];b=x[1];if(a.sc[A.k]>b.sc[A.k])break}
items.push({html:'<div class="sm">'+LBL[A.k]+' score</div>'+bars(A.k,[a.id,b.id])+'<p style="font-size:20px"><b>'+a.n+'</b> is ____ than <b>'+b.n+'</b>.</p>',
opts:[A.c,A.w[0],A.w[1]],a:0,hint:A.rule,say:a.n+' is '+A.c+' than '+b.n+'.',ok:a.n+' is '+A.c+' than '+b.n+'.'});
}else{
var best=PERF.slice().sort(function(p,q){return q.sc[A.k]-p.sc[A.k]})[0];
items.push({html:'<div class="sm">'+LBL[A.k]+' score</div>'+bars(A.k,PERF.map(function(p){return p.id}))+'<p style="font-size:20px"><b>'+best.n+'</b> is ____ in the group.</p>',
opts:[A.s,A.ws[0],A.ws[1]],a:0,hint:A.rule,say:best.n+' is '+A.s+' in the group.',ok:best.n+' is '+A.s+' in the group.'});
}});
quiz('compare','Compare','انظر إلى الأعمدة ثم اختر صيغة المقارنة الصحيحة.',items.slice(0,8))}
// ---- 5 judge
function judge(){
var qs=[
['tidy','Who is the tidiest performer?'],['hw','Who is the most hard-working?'],['conf','Who is the most confident?'],['skill','Who has the best talent score?'],['fr','Who is the friendliest?'],['tidy','Who is the least tidy? (the untidiest)']];
var items;
items=qs.map(function(q,i){
var sorted=PERF.slice().sort(function(a,b){return i===5?a.sc[q[0]]-b.sc[q[0]]:b.sc[q[0]]-a.sc[q[0]]});
var top=sorted[0];var ties=sorted.filter(function(p){return p.sc[q[0]]===top.sc[q[0]]});
if(ties.length>1){top=ties[0]}
var others=shuffle(PERF.filter(function(p){return p.sc[q[0]]!==top.sc[q[0]]})).slice(0,2);
return{html:'<div class="sm">'+LBL[q[0]]+' scores</div>'+bars(q[0],PERF.map(function(p){return p.id}))+'<p style="font-size:20px">'+q[1]+'</p>',opts:[top.n,others[0].n,others[1].n],a:0,hint:'Look at the bars. Find the '+(i===5?'shortest':'longest')+' bar.',say:q[1]}});
quiz('judge','The judges','انظر إلى الأعمدة وأجب عن أسئلة لجنة التحكيم.',items)}
// ---- 6 write
function write(){
var W=S.write;var d=el('<div></div>');d.appendChild(backBtn());
d.appendChild(el('<h2>Write your description</h2>'));d.appendChild(el('<div class="ar">اختر موهوبًا واكتب عنه. معلمك هو من يقيّم كتابتك.</div>'));
var c=el('<div class="card"></div>');
c.innerHTML='<b>1. Choose a performer</b><div class="perfs" id="pp" style="margin-top:8px"></div>';
d.appendChild(c);
var pp=c.querySelector('#pp');
function sel(){return P(W.pid)}
PERF.forEach(function(p){var b=el('<button class="pc'+(W.pid===p.id?' sel':'')+'">'+avatar(p,56)+'<div>'+p.n+'</div></button>');b.onclick=function(){W.pid=p.id;W.cmp=null;save();write()};pp.appendChild(b)});
var out=el('<div class="card" id="out"></div>');d.appendChild(out);
if(!W.pid){out.innerHTML='<p class="sm">Choose a performer to start.</p>';show(d);return}
var p=sel(),H=he(p),h=his(p);
var others=PERF.filter(function(x){return x.id!==p.id});
var cmpId=W.cmp||others[0].id;
out.innerHTML='<b>2. Fill the plan</b><label>Who? ('+p.n+')</label><div class="sm">'+p.n+' is a '+(p.g==='m'?'boy':'girl')+'.</div>'+
'<label>What does '+(p.g==='m'?'he':'she')+' look like?</label><div class="sm">'+H+'\u2019s got '+p.hair.join(', ')+' hair.</div>'+
'<label>What is '+(p.g==='m'?'he':'she')+' like?</label><div class="chips"><span class="chip">'+p.traits[0]+'</span><span class="chip">'+p.traits[1]+'</span></div>'+
'<label>What is '+(p.g==='m'?'he':'she')+' good at?</label><div class="sm">'+p.skill+'</div>'+
'<label>Compare '+p.n+' with:</label><select id="cmp">'+others.map(function(o){return '<option value="'+o.id+'"'+(o.id===cmpId?' selected':'')+'>'+o.n+'</option>'}).join('')+'</select>'+
'<label>Adjective for the comparison:</label><select id="adj">'+ADJ.map(function(A,i){return '<option value="'+i+'"'+((W.adj||0)==i?' selected':'')+'>'+A.adj+'</option>'}).join('')+'</select>';
var o2=P(cmpId);
function compSentence(){var A=ADJ[W.adj||0];var q=P(out.querySelector('#cmp').value);var hi=p.sc[A.k]>=q.sc[A.k];
if(p.sc[A.k]===q.sc[A.k])return p.n+' and '+q.n+' are the same.';
return hi?p.n+' is '+A.c+' than '+q.n+'.':q.n+' is '+A.c+' than '+p.n+'.'}
var tb=el('<div class="card"><b>3. Your description</b><div class="sm">Press the button to build your first draft, then change it in your own words.</div><textarea id="ta" aria-label="Your description"></textarea></div>');
var bb=el('<button class="btn" style="margin-top:8px">Build my first draft</button>');
bb.onclick=function(){
W.cmp=out.querySelector('#cmp').value;W.adj=out.querySelector('#adj').value;
var text='Let me tell you about '+p.n+'.\n'+p.n+' is a '+(p.g==='m'?'boy':'girl')+'. '+H+'\u2019s got '+p.hair.join(', ')+' hair.\n'+H+' seems '+p.traits[0]+' and '+p.traits[1]+'.\n'+H+'\u2019s good at '+p.skill+'.\n'+compSentence()+'\nI think '+p.n+' is great!';
W.text=text;save();tb.querySelector('#ta').value=text};
tb.appendChild(bb);
var ta=tb.querySelector('#ta');ta.value=W.text||'';ta.oninput=function(){W.text=ta.value;save()};
d.appendChild(tb);
var ckc=el('<div class="card"><b>4. Check your writing</b></div>');
['I wrote who the performer is.','I wrote what he/she looks like. (long/short first)','I wrote what he/she is like (seems + adjective).','I wrote what he/she is good at.','I used -er / more / better to compare.','I read it again and fixed capital letters and full stops.'].forEach(function(t,i){
var l=el('<label class="ck"><input type="checkbox"'+((W.ck||{})[i]?' checked':'')+'><span style="font-weight:400">'+t+'</span></label>');
l.querySelector('input').onchange=function(e){W.ck=W.ck||{};W.ck[i]=e.target.checked;save();var n=Object.keys(W.ck).filter(function(k){return W.ck[k]}).length;if(n>=6&&(W.text||'').length>60)rate('write',3);else if(n>=4)rate('write',2);else if(n>=1)rate('write',1)};
ckc.appendChild(l)});
d.appendChild(ckc);
var note=el('<p class="sm">Your teacher checks your writing. The stars show you finished the checklist, not a mark. Your text stays on this device.</p>');d.appendChild(note);
show(d)}
home();
})();
</script>
