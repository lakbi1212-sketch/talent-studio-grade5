 var h='<div class="prog"><i id="mp" style="width:0"></i></div><div class="q"><span class="hint">اضغط فعلًا ثم معناه بالعربي لتطابقهما</span></div><div class="mem">'+cards.map(function(c,i){return '<button class="mc '+(c.en?'en':'')+'" data-i="'+i+'">'+esc(c.t)+'</button>'}).join('')+'</div><div class="fb" id="fb"></div>';show(h);
 var sel=null,done=0,miss=0;P.querySelector('.mem').onclick=function(e){var b=e.target.closest('.mc');if(!b||b.classList.contains('done'))return;var c=cards[b.dataset.i];
  if(!sel){sel=b;b.classList.add('sel');return}if(sel===b){b.classList.remove('sel');sel=null;return}
  var a=cards[sel.dataset.i];if(a.k===c.k&&a.en!==c.en){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;done++;$('#mp').style.width=(done/6*100)+'%';$('#fb').className='fb ok';$('#fb').textContent=PRAISE[done%5];
   if(done===6){ST.stars+=Math.max(2,8-miss);ST.done++;save();$('#fb').innerHTML='🎉 أنجزت اللعبة بـ '+miss+' أخطاء!<div class="row"><button class="btn" id="again">مرة أخرى 🔁</button></div>';$('#again').onclick=memory}}
  else{miss++;var s0=sel;sel=null;s0.classList.remove('sel');s0.classList.add('bad');b.classList.add('bad');setTimeout(function(){s0.classList.remove('bad');b.classList.remove('bad')},600);$('#fb').className='fb no';$('#fb').textContent='ليست مطابقة، جرّب مرة أخرى'}}}
</script></body></html>
