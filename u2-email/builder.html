<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابنِ إيميلك | درس كتابة الإيميل | الصف الخامس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Naskh Arabic',Tahoma,sans-serif;background:#f4f8fa;color:#17324f;line-height:1.8;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;max-width:760px;margin:14px auto 0;padding:0 16px;flex-wrap:wrap}
.lesson-nav a{display:inline-block;padding:12px;background:#e3f2f4;border-radius:8px;color:#17324f;text-decoration:none;font-weight:700;min-height:44px}
h1{font-size:24px;color:#1b3866;margin:14px 0 4px}
.sub{color:#4a6076;font-size:16px;margin-bottom:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;border:2px solid #d5e2eb}
.row{margin:12px 0}
.row label{display:block;font-weight:800;color:#1b3866;font-size:17px;margin-bottom:6px}
.row .en-hint{display:block;direction:ltr;text-align:left;font-weight:400;font-size:14px;color:#4a6076}
select{width:100%;font-family:'Patrick Hand',cursive;font-size:19px;direction:ltr;text-align:left;padding:12px;border:2px solid #b8cdd8;border-radius:10px;background:#fbfdfe;color:#17324f;min-height:48px}
select:focus{outline:3px solid #098391;outline-offset:2px}
#sit{direction:ltr;text-align:left;background:#edf3fa;border-radius:10px;padding:12px;font-size:16px;line-height:1.7;color:#17324f;margin-top:6px}
.preview{background:#fffef7;border:2px dashed #c9b458;border-radius:14px;padding:20px;direction:ltr;text-align:left;font-family:'Patrick Hand',cursive;font-size:21px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;min-height:200px}
.counter{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:17px;font-weight:700}
.counter .bar{flex:1;height:14px;background:#e3eef3;border-radius:8px;overflow:hidden}
.counter .fill{height:100%;background:#098391;width:0%;transition:width .3s}
.counter .fill.done{background:#2e9e5b}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.actions button{flex:1;min-width:150px;font:inherit;font-weight:800;font-size:18px;padding:14px;border:none;border-radius:12px;cursor:pointer;min-height:54px}
.btn-save{background:#098391;color:#fff}
.btn-print{background:#1b3866;color:#fff}
.btn-save:hover,.btn-print:hover{filter:brightness(1.1)}
.credit{max-width:760px;margin:18px auto;padding:0 16px;font-size:13px;color:#6a7f8f;text-align:center;direction:ltr}

.row.part{border-right:5px solid var(--pc);padding-right:10px}
.row.part label{color:var(--pc)}
.pv-greet{color:#0e7c86}.pv-open{color:#1b3866}.pv-body{color:#237a57}.pv-close{color:#c2610a}.pv-name{color:#8e4585}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.legend span{font-size:13px;font-weight:700;color:#fff;border-radius:8px;padding:3px 10px}
canvas{display:none}
@media(max-width:400px){h1{font-size:21px}.actions button{font-size:16px;min-height:50px}.preview{font-size:19px}}
@media print{body{background:#fff}.lesson-nav,.card.pick,.actions,.counter,.credit{display:none}.preview{border:none;font-size:22px}}
</style>
</head>
<body>
<nav class="lesson-nav"><a href="./">← درس كتابة الإيميل</a><a href="../unit2.html">الوحدة الثانية</a></nav>
<main class="wrap">
<h1>✍️ ابنِ إيميلك</h1>
<p class="sub">اختر الوحدة ثم الموضوع المتوقع في الاختبار، وبعدها اختر جملة لكل جزء وشاهد إيميلك يكتمل. المطلوب: 40 كلمة على الأقل.</p>

<div class="card pick">
<div class="row"><label>الوحدة<span class="en-hint">unit</span></label>
<select id="unit"></select></div>
<div class="row"><label>موضوع الإيميل<span class="en-hint">expected exam topic</span></label>
<select id="topic"></select></div>
<p id="sit"></p>
</div>

<div class="card pick">
<div class="row part" style="--pc:#0e7c86"><label>١ · التحية<span class="en-hint">greeting</span></label>
<select id="greet">
<option>Dear Ali,</option>
<option>Dear Alia,</option>
<option>Hi Ali,</option>
<option>Hello Alia,</option>
</select></div>

<div class="row part" style="--pc:#1b3866"><label>٢ · جملة البداية<span class="en-hint">opening sentence</span></label>
<select id="open">
<option>How are you? I hope you are fine. I want to tell you about my trip.</option>
<option>I hope you are well. Last week, I went on a great trip.</option>
<option>Thank you for your email. I want to tell you about a wonderful trip.</option>
<option>Guess what! I went on an amazing trip last Friday.</option>
</select></div>

<div class="row part" style="--pc:#237a57"><label id="lb{i}">٣</label><select id="b1"></select></div>
<div class="row part" style="--pc:#237a57"><label id="lb{i}">٤</label><select id="b2"></select></div>
<div class="row part" style="--pc:#237a57"><label id="lb{i}">٥</label><select id="b3"></select></div>
<div class="row part" style="--pc:#237a57"><label id="lb{i}">٦</label><select id="b4"></select></div>

<div class="row part" style="--pc:#c2610a"><label>٧ · الختام<span class="en-hint">closing</span></label>
<select id="close">
<option>Love,</option>
<option>Best wishes,</option>
<option>Your friend,</option>
<option>See you soon,</option>
</select></div>

<div class="row part" style="--pc:#8e4585"><label>٨ · اسمك<span class="en-hint">your name (Sami or Asma in the exam)</span></label>
<select id="name">
<option>Sami</option>
<option>Asma</option>
</select></div>
</div>

<div class="card">
<label style="font-weight:800;color:#1b3866;font-size:17px">إيميلك جاهز ✉️</label><div class="legend"><span style="background:#0e7c86">التحية</span><span style="background:#1b3866">البداية</span><span style="background:#237a57">الجسم</span><span style="background:#c2610a">الختام</span><span style="background:#8e4585">الاسم</span></div>
<div class="preview" id="pv" aria-live="polite"></div>
<div class="counter"><span id="wc">0 كلمة</span><div class="bar"><div class="fill" id="fill"></div></div><span id="goal">الهدف: 40+</span></div>
</div>

<div class="actions">
<button class="btn-save" id="saveBtn">💾 احفظ إيميلي كصورة</button>
<button class="btn-print" id="printBtn">🖨️ اطبع إيميلي</button>
</div>
<canvas id="cv" width="1000" height="1200"></canvas>
</main>
<div class="credit">Prepared by: Mohamed Mostafa Al Shorbagy<br>Regional Supervisor, Wusta Governorate</div>
<script>
const TOPICS={"1": {"name": "الوحدة الأولى · Talent show", "topics": [{"t": "عرض المواهب في المدرسة", "en": "A talent show at school", "sit": "Your friend could not come to the school talent show. Write an email to your friend and tell him/her about the show.", "p": [["متى كان العرض؟", "When was the show?"], ["ما المميز فيه؟", "What was special about it?"], ["ماذا رأيت وفعلت؟", "What could you see and do?"], ["ماذا تعلمت؟", "What did you learn?"]], "b": [["Last Friday, our school had a big talent show.", "On Thursday, we had a talent show in the school hall."], ["Many talented students were there. My friend Salim sang a beautiful song.", "The show was full of amazing acts."], ["I could see singers, dancers and a short play. I took many photos.", "One girl played the piano, and two boys told funny jokes."], ["I learned that everyone has a special talent. I had a great time.", "It was a wonderful day. I really enjoyed the show."]]}, {"t": "مسابقة الموسيقى", "en": "A music competition", "sit": "Your friend was sick and missed the school music competition. Write an email to your friend and tell him/her about it.", "p": [["متى كانت المسابقة؟", "When was the competition?"], ["ما المميز فيها؟", "What was special about it?"], ["ماذا سمعت ورأيت؟", "What could you hear and see?"], ["ماذا تعلمت؟", "What did you learn?"]], "b": [["Yesterday, our school had a music competition.", "Last week, we had a big music competition at school."], ["Many students played music and sang. The hall was full of parents and teachers.", "It was a beautiful event with many talented students."], ["I could hear the oud, the piano and the guitar. Our class sang two songs.", "We watched ten students play different instruments."], ["I learned that practice makes talent grow. I had a great time.", "I really enjoyed the music and learned a lot."]]}, {"t": "يوم مميز في المدرسة", "en": "A special school day", "sit": "Your school had a festival or a special day. Write an email to your pen friend in another country and tell him/her about it.", "p": [["متى كان اليوم المميز؟", "When was the special day?"], ["ما المميز فيه؟", "What was special about it?"], ["ماذا رأيت وفعلت؟", "What could you see and do?"], ["ماذا تعلمت؟", "What did you learn?"]], "b": [["Last Wednesday, our school had a wonderful festival.", "On Tuesday, we had a special day at school."], ["The school was full of colours, food and games. Everyone was happy.", "There were games, food stalls and music everywhere."], ["I could play games, eat traditional food and watch shows.", "We sang the national anthem and watched a play."], ["I learned a lot about working together. It was a day to remember.", "I will never forget this day."]]}]}, "2": {"name": "الوحدة الثانية · Then and now", "topics": [{"t": "رحلة إلى متحف", "en": "A trip to a museum", "sit": "Your name is Sami. Write an email to your friend Ali about a trip to a museum.", "p": [["متى وأين ذهبت؟", "When and where did you go?"], ["ما المميز في المكان؟", "What was special about it?"], ["ماذا رأيت وفعلت هناك؟", "What could you see and do there?"], ["ماذا تعلمت؟", "What did you learn?"]], "b": [["Last Friday, I went to the National Museum in Muscat with my class.", "On Thursday morning, I visited the Natural History Museum with my family.", "Yesterday, my class went on a school trip to a big museum in the city."], ["The museum was very big and full of interesting things.", "It was a beautiful place with many old and rare objects.", "The building was amazing, and everything inside was special."], ["I could see old boats, swords and traditional clothes. I also watched a short film about the sea.", "We saw gold jewellery and old coins. Then we drew pictures of our favourite things.", "There were rooms about Omani life in the past. I took many photos with my friends."], ["I learned a lot about the history of my country.", "I learned how people lived many years ago.", "I learned many new things about ships and fishing."]]}, {"t": "الحياة في الماضي", "en": "Life in Oman in the past", "sit": "Your cousin wants to know about life in Oman in the past. Write an email to him/her and describe how people lived then.", "p": [["كيف عاش الناس؟", "How did people live?"], ["ماذا كان عملهم؟", "What did they do?"], ["ماذا استخدموا؟", "What did they use?"], ["ماذا تعلمت؟", "What did you learn?"]], "b": [["Long ago, people in Oman lived in small villages near the sea or the mountains.", "In the past, people lived in simple houses made of mud and palm leaves."], ["Life was hard, but people worked together.", "People were farmers, fishermen and sailors."], ["They used dhows to travel and trade with other countries. They could fish, farm and make boats.", "They cooked on fire and carried water from wells."], ["I learned that our grandparents had a simple and strong life.", "Now I understand how life changed in Oman."]]}, {"t": "زيارة قرية تراثية", "en": "A heritage village visit", "sit": "Your class visited a heritage village or a museum. Write an email to your cousin and tell him/her about the visit.", "p": [["متى وأين ذهبتم؟", "When and where did you go?"], ["ما المميز في المكان؟", "What was special about it?"], ["ماذا رأيت وفعلت؟", "What could you see and do?"], ["ماذا تعلمت؟", "What did you learn?"]], "b": [["Last Friday, my class visited a heritage village.", "On Thursday, we went on a school trip to an old village."], ["The village was old and beautiful, with small mud houses.", "It was a special place that shows life in the past."], ["I could see old tools, pots and clothes. We watched people make bread.", "There were small shops selling old crafts."], ["I learned how people lived many years ago. I had a great time.", "I learned a lot about our history."]]}]}, "3": {"name": "الوحدة الثالثة · Let's explore!", "topics": [{"t": "مكان جميل في بلادي", "en": "A beautiful place to explore", "sit": "Your class is planning a trip to explore a new place. Write an email to your friend inviting him/her to come with you.", "p": [["إلى أين ستذهبون؟", "Where will you go?"], ["ما المميز في المكان؟", "What is special about it?"], ["ماذا ستفعلون؟", "What will you see and do?"], ["ادعُ صديقك", "Invite your friend"]], "b": [["Next Friday, my class is going to Wadi Shab.", "We are going to visit Jebel Akhdar next week."], ["It is a beautiful place with green water and high mountains.", "The place is famous for its wonderful views."], ["We will swim, walk and take many photos.", "We are going to explore the valley and have a picnic."], ["I hope you can come with us. It will be a great day!", "Please join us. We will have a wonderful time together."]]}, {"t": "مغامرة في الطبيعة", "en": "An adventure in nature", "sit": "Your friend wants to do something fun at the weekend. Write an email to your friend and invite him/her on a trip to a beautiful place.", "p": [["إلى أين ستذهبون؟", "Where will you go?"], ["ما المميز في المكان؟", "What is special about it?"], ["ماذا ستفعلون؟", "What will you do?"], ["ادعُ صديقك", "Invite your friend"]], "b": [["This weekend, my family is going to the desert.", "On Friday, we are going camping near the sea."], ["The desert is quiet and full of golden sand.", "The beach is clean and the water is blue."], ["We will ride camels, play on the dunes and watch the stars.", "We will swim, play ball games and collect shells."], ["Come with us! We will have a great time together.", "I hope you join us. It will be fun!"]]}, {"t": "عطلة نهاية أسبوع مثالية", "en": "A perfect weekend", "sit": "Your cousin is coming to visit Oman next month. Write an email to your cousin and tell him/her what you are going to do.", "p": [["ما خطتك؟", "What is your plan?"], ["ما المميز في الوقت؟", "What is special about the time?"], ["ماذا ستفعلون؟", "What will you do?"], ["ختم بدعوة", "End with a warm note"]], "b": [["I am so happy you are coming next month! We have many plans.", "Next month, when you arrive, we will do many fun things."], ["The weather is nice in this season.", "My family and I are preparing a great programme for you."], ["We are going to visit the Grand Mosque, the souq and the beach.", "We will go to the mountains and try Omani food."], ["I can't wait to see you. It will be the perfect weekend!", "Get ready for a wonderful time!"]]}]}, "4": {"name": "الوحدة الرابعة · Off to the shops", "topics": [{"t": "متجري المفضل", "en": "A good shop in my town", "sit": "Your friend wants to buy a gift for his/her mother. Write an email to him/her about a good shop in your town.", "p": [["ما المتجر؟", "What is the shop?"], ["ما المميز فيه؟", "What is special about it?"], ["ماذا يمكن أن يشتري؟", "What can your friend buy there?"], ["نصيحة أخيرة", "A final tip"]], "b": [["There is a nice shop in our town called Al Baraka Gifts.", "My favourite shop is the big bookshop near the market."], ["It is clean and the people there are friendly.", "The shop has many beautiful things at good prices."], ["You can buy flowers, cards, toys and pretty boxes there.", "They sell books, pens and lovely gift bags."], ["I am sure you will find a wonderful gift for your mother there.", "Go there on Friday. You will find the perfect gift!"]]}, {"t": "أفكار لهدية", "en": "Gift ideas for a special day", "sit": "Your friend needs to buy a gift for his/her mother but does not know what to buy. Write an email to your friend and give him/her some ideas.", "p": [["ما فكرتك الأولى؟", "What is your first idea?"], ["ما نصيحتك؟", "What is your advice?"], ["ماذا يمكن أن يشتري؟", "What could your friend buy?"], ["ختم بتشجيع", "End with encouragement"]], "b": [["I have some good ideas for your mother's gift.", "Buying a gift for your mum is easy if you plan well."], ["First, think about what she likes.", "A good gift shows love, not money."], ["You could buy her a nice scarf, a flower pot or a photo frame.", "You could make a card and buy her favourite sweets."], ["I am sure she will love your gift. Good luck!", "Whatever you choose, she will be happy because it is from you."]]}]}};
const unitSel=document.getElementById('unit'),topicSel=document.getElementById('topic');
const nums=['٣','٤','٥','٦'];
function fillUnits(){unitSel.innerHTML=Object.keys(TOPICS).map(k=>'<option value="'+k+'">'+TOPICS[k].name+'</option>').join('')}
function fillTopics(){const u=TOPICS[unitSel.value];topicSel.innerHTML=u.topics.map((t,i)=>'<option value="'+i+'">'+t.t+' · '+t.en+'</option>').join('')}
function fillTopic(){
  const t=TOPICS[unitSel.value].topics[+topicSel.value];
  document.getElementById('sit').textContent='Situation: '+t.sit;
  t.p.forEach((p,i)=>{
    document.getElementById('lb'+(i+1)).innerHTML=nums[i]+' · '+p[0]+'<span class="en-hint">'+p[1]+'</span>';
    document.getElementById('b'+(i+1)).innerHTML=t.b[i].map(o=>'<option>'+o+'</option>').join('');
  });
  render();
}
unitSel.addEventListener('change',()=>{fillTopics();fillTopic()});
topicSel.addEventListener('change',fillTopic);
const ids=['greet','open','b1','b2','b3','b4','close','name'];
const parts=()=>ids.map(i=>document.getElementById(i).value);
function emailText(){
  const p=parts();
  return p[0]+'\n\n'+p[1]+' '+p[2]+' '+p[3]+' '+p[4]+' '+p[5]+'\n\n'+p[6]+'\n'+p[7];
}
function words(){return emailText().split(/\s+/).filter(w=>/[A-Za-z]/.test(w)).length}
function render(){
  const p=parts();
  document.getElementById('pv').innerHTML=
    '<div class="pv-greet">'+p[0]+'</div><br>'+
    '<div><span class="pv-open">'+p[1]+'</span> <span class="pv-body">'+p[2]+' '+p[3]+' '+p[4]+' '+p[5]+'</span></div><br>'+
    '<div class="pv-close">'+p[6]+'</div>'+
    '<div class="pv-name">'+p[7]+'</div>';
  const w=words(),f=document.getElementById('fill');
  document.getElementById('wc').textContent=w+' كلمة';
  f.style.width=Math.min(100,Math.round(w/40*100))+'%';
  f.classList.toggle('done',w>=40);
  document.getElementById('goal').textContent=w>=40?'ممتاز! 40+ ✓':'الهدف: 40+';
}
ids.forEach(i=>document.getElementById(i).addEventListener('change',render));
fillUnits();fillTopics();fillTopic();
document.getElementById('printBtn').addEventListener('click',()=>window.print());
document.getElementById('saveBtn').addEventListener('click',()=>{
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  ctx.fillStyle='#fffef7';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='#c9b458';ctx.lineWidth=4;ctx.strokeRect(20,20,cv.width-40,cv.height-40);
  ctx.direction='ltr';ctx.textAlign='left';
  ctx.font='34px "Patrick Hand", cursive';
  const x=70;let y=110;const maxW=cv.width-140;
  const p=parts();
  const C={greet:'#0e7c86',open:'#1b3866',body:'#237a57',close:'#c2610a',name:'#8e4585'};
  const segs=[[p[0],C.greet],[p[1],C.open],[p[2]+' '+p[3]+' '+p[4]+' '+p[5],C.body],[p[6],C.close],[p[7],C.name]];
  segs.forEach(([txt,color],si)=>{
    ctx.fillStyle=color;
    const ws=txt.split(' ');let cur='';
    for(const w of ws){
      const t=cur?cur+' '+w:w;
      if(ctx.measureText(t).width>maxW&&cur){ctx.fillText(cur,x,y);y+=52;cur=w}
      else cur=t;
    }
    if(cur){ctx.fillText(cur,x,y);y+=52}
    if(si===0||si===2)y+=28; // blank line after greeting and body
  });
  const a=document.createElement('a');
  a.download='my-email.png';
  a.href=cv.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
