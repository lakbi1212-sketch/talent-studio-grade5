<!DOCTYPE html>
<html><head><meta charset="utf-8"><title></title></head>
<body><script>
(function () {
  try {
    if (window.top === window.self) return; // only acts inside the migration iframe
    var m = (location.hash || "").match(/[#&]to=([^&]+)/);
    if (!m) return;
    var to = decodeURIComponent(m[1]);
    if (!/^https:\/\/[a-z0-9-]+\.itqan-gate\.workers\.dev$/.test(to)) return; // only send to our new origin
    var data = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      data[k] = localStorage.getItem(k); // read-only: never delete or alter old-site data
    }
    parent.postMessage({ type: "itqan-migrate-v1", data: data }, to);
  } catch (e) {}
})();
</script><script src="redirect.js"></script>
</body></html>
